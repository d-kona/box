<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width">
    <meta name="description" content="Sform - 전자문서 통합 플랫폼">
    <meta name="author" content="">
    <title>Sform - 전자문서 통합 플랫폼</title>
    <link rel="shortcut icon" type="image/x-icon" href="./images/favicon.ico"/>
    <!-- css -->
    <link type="text/css" rel="stylesheet" href="./css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="./css/sform-portal.css">
    <!-- js -->
    <script src="./js/jquery.min.js"></script>
    <script type="text/javascript" src="./js/bootstrap.min.js"></script>
    <script>
        // header 스크롤
        $(window).on('scroll', function () {
            $('header').toggleClass('scrolled', $(this).scrollTop() > 0);
        }).trigger('scroll');

        // nav 모바일
        $(function() {
            $('.nav-mob').on('click', function() {
                $('header').toggleClass('is-open');
                $('body').css('overflow', $('header').hasClass('is-open') ? 'hidden' : '');
            });
        });

        // 슬로건 타이핑
        $(function() {
            const $pList = $('.slogan-area p');
            if (!$pList.length) return;

            const texts = [];
            $pList.each(function() {
                texts.push($(this).text().trim());
                $(this).text('');
            });

            const typeSpeed = 80;
            const lineDelay = 400;
            const endDelay  = 2400;

            function typeLine(lineIndex) {
                const $target = $pList.eq(lineIndex);
                const fullText = texts[lineIndex];
                const isLastLine = (lineIndex === $pList.length - 1);
                let charIndex = 0;

                $target.addClass('typing');

                function typeChar() {
                if (charIndex < fullText.length) {
                    $target.text($target.text() + fullText.charAt(charIndex));
                    charIndex++;
                    setTimeout(typeChar, typeSpeed);
                } else {
                    if (isLastLine) {
                    setTimeout(function() {
                        $target.removeClass('typing');
                    }, endDelay);
                    } else {
                    setTimeout(function() {
                        $target.removeClass('typing');
                        typeLine(lineIndex + 1);
                    }, lineDelay);
                    }
                }
                }
                typeChar();
            }
            setTimeout(function() {
                typeLine(0);
            }, 400);
        });

        // 토스트 메시지
        $(document).ready(function() {
            let toastTimer;
            let insideTimer;

            $('.btn-submit').on('click', function(e) {
                e.preventDefault();

                const $area = $('.toast-msg-area');
                const $msg = $('.toast-msg.success');

                clearTimeout(toastTimer);
                clearTimeout(insideTimer);
                $area.stop(true, true);
                $msg.removeClass('active').hide(); 

                $area.fadeIn(300); 

                insideTimer = setTimeout(function() {
                    $msg.css('display', 'flex').hide().fadeIn(0, function() {
                        $msg.addClass('active'); 
                    });
                }, 300);

                toastTimer = setTimeout(function() {
                    $area.fadeOut(400, function() {
                        $msg.removeClass('active').hide(); 
                    });
                }, 4000);
            });
        });
    </script>
</head>
<body>
<div class="wrap contact-page">
    <div class="contact-page-in">
        <header>
            <div class="header-in">
                <div class="logo-area">
                    <a href=""><img src="./images/logo-sform-w.svg" alt="에스폼 로고"/></a>
                </div>
            </div>
        </header>

        <div class="content-area">
            <section class="contact-area">
                <h2>도입문의</h2>
                <div class="contact-area-in">
                    <form>
                        <div class="form-area">
                            <dl class="check-type required-field">
                                <dt>유형</dt>
                                <dd>
                                    <div class="checkbox-area check-btn">
                                        <input type="checkbox" id="svc-type-1" title="구축형">
                                        <label for="svc-type-1" class="check-label">구축형</label>
                                        <input type="checkbox" id="svc-type-2" title="렌탈형">
                                        <label for="svc-type-2" class="check-label">렌탈형</label>
                                        <input type="checkbox" id="svc-type-3" title="API 연동형">
                                        <label for="svc-type-3" class="check-label">API 연동형</label>
                                        <input type="checkbox" id="svc-type-4" title="SaaS 서비스형">
                                        <label for="svc-type-4" class="check-label">SaaS 서비스형</label>
                                    </div>
                                </dd>
                            </dl>
                            <dl class="required-field">
                                <dt>회사명</dt>
                                <dd><input class="inp" type="text" placeholder="회사명을 입력해주세요"></dd>
                            </dl>
                            <dl class="required-field">
                                <dt>이름</dt>
                                <dd><input class="inp" type="text" placeholder="이름을 입력해주세요"></dd>
                            </dl>
                            <dl class="required-field">
                                <dt>연락처</dt>
                                <dd>
                                    <input class="inp" type="text" maxlength="11" placeholder="연락처를 입력해주세요('-'제외)">
                                </dd>
                            </dl>
                            <dl class="required-field">
                                <dt>이메일</dt>
                                <dd>
                                    <input class="inp" type="text" placeholder="이메일을 입력해주세요">
                                </dd>
                            </dl>
                            <dl class="in-textarea">
                                <dt>내용</dt>
                                <dd><textarea rows="4" placeholder="문의하실 내용을 입력해주세요" style="resize: none;"></textarea></dd>
                            </dl>
                        </div>
                        <div class="agree-area required-field">
                            <p class="cont-tt">개인정보 수집 · 이용 동의</p>
                            <div class="cont-area">
                                <p>수집목적 : 서비스 도입 문의에 대한 상담 목적 및 마케팅 활용</p>
                                <p>수집항목 : 회사명, 이름, 연락처, 이메일</p>
                                <p>* 그 밖의 사항은 <a class="link" href="" target="_blank">개인정보처리방침</a>을 준수합니다.</p>
                            </div>
                            <div class="checkbox-area">
                                <input type="checkbox" id="agree" title="개인정보 수집 · 이용 동의">
                                <label for="agree" class="check-label">동의합니다.</label>
                            </div>
                        </div>
                        <div class="g-recaptcha" data-sitekey="6LdUb0kpAAAAAOpAZcCM4YNbSw2aeIw8qmUspJ10" data-action="service_introduce" data-callback="recaptchaCallback"><div style="width: 304px; height: 78px;"><div><iframe title="reCAPTCHA" width="304" height="78" role="presentation" name="a-8zkf8valzhdz" frameborder="0" scrolling="no" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation allow-modals allow-popups-to-escape-sandbox allow-storage-access-by-user-activation" src="https://www.google.com/recaptcha/enterprise/anchor?ar=1&amp;k=6LdUb0kpAAAAAOpAZcCM4YNbSw2aeIw8qmUspJ10&amp;co=aHR0cHM6Ly91bmlwb3N0LmNvLmtyOjQ0Mw..&amp;hl=ko&amp;v=nY0xPItgwtlvjEjk2TqdwOQz&amp;size=normal&amp;sa=service_introduce&amp;anchor-ms=20000&amp;execute-ms=30000&amp;cb=hwfeb4gwijdk"></iframe></div><textarea id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px; height: 40px; border: 1px solid rgb(193, 193, 193); margin: 10px 25px; padding: 0px; resize: none; display: none;"></textarea></div><iframe ke5ryw="" style="display: none;"></iframe></div>
                    </form>
                    <div class="btn-area">
                        <button type="button" class="btn-submit">제출하기</button>
                    </div>
                </div>
                <!-- ! 토스트 메시지 -->
                <div class="toast-msg-area">
                <!-- .success / .caution / .danger -->
                    <div class="toast-msg success">
                        <div class="toast-msg-in">
                            <div class="msg-box">
                                <p>문의를 제출했습니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <div class="footer-in">
                <div class="slogan-area">
                    <p>작성∙서명∙보관을 한 곳에서</p>
                    <p>계약을 넘어 모든 문서 업무의 디지털 전환</p>
                </div>
                <ul class="info-area">
                    <li>ⓒUNIPOST. All rights reserved.</li>
                </ul>
            </div>
        </footer>
    </div>
</div>
</body>
</html>
