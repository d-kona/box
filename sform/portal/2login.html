<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width">
    <meta name="description" content="Sform - 전자문서 통합 플랫폼">
    <meta name="author" content="">
    <title>Sform - 전자문서 통합 플랫폼</title>
    <link rel="shortcut icon" type="image/x-icon" href="./images/favicon.ico"/>
    <!-- css -->
    <link type="text/css" rel="stylesheet" href="./css/bootstrap.min.css">
    <link type="text/css" rel="stylesheet" href="./css/sform-portal.css">
    <!-- js -->
    <script src="./js/jquery.min.js"></script>
    <script type="text/javascript" src="./js/bootstrap.min.js"></script>
    <script>
        // 언어 선택
        $(function() {
            const $select = $('#lang-select');

            function applyWhiteColor() {
                $select.removeAttr('style');
                $select.find('option').removeAttr('style');
                $select.each(function() {
                    this.style.setProperty('color','#ffffff','important');
                });
                $select.find('option').each(function() {
                    this.style.setProperty('color','#222222','important');
                });
            }
            
            applyWhiteColor();
            $select.on('change', applyWhiteColor);
        });

        // 비밀번호 보기
        $(function(){
            $('.pw-area .btn-toggle').on('click',function(){
                $(this).parents('.pw-area').toggleClass('open');
                if( $(this).parents('.pw-area').hasClass('open') == true ){
                    $(this).parents('.pw-area').find('.inp').attr('type',"text");
                }
                else{
                    $(this).parents('.pw-area').find('.inp').attr('type','password');
                }
            });
        });

        // 아이디/비번찾기 전환
        $(function() {
            const $login = $('.login-area').not('.find-info');
            const $findInfo = $('.login-area.find-info');

            $login.addClass('on');
            setTimeout(function() {
                $login.addClass('fade-in');
            }, 30);

            function fadeSwitch($hideTarget, $showTarget) {
                $hideTarget.removeClass('fade-in');
                setTimeout(function() {
                    $hideTarget.removeClass('on');
                    $showTarget.addClass('on');

                    setTimeout(function() {
                        $showTarget.addClass('fade-in');
                    }, 30);
                }, 150);
            }

            $('.btn-link.section-change a').on('click', function(e) {
                e.preventDefault();
                if ($login.hasClass('fade-in')) {
                    fadeSwitch($login, $findInfo);
                } else {
                    fadeSwitch($findInfo, $login);
                }
            });
        });

        // 아이디/비번찾기 온오프
        $(function() {
            function initMobileTab() {
                if ($(window).width() <= 1023) {
                    if ($('.btn-find-id').hasClass('on')) {
                        $('.find-id').addClass('on');
                        $('.find-pw').removeClass('on');
                    } else if ($('.btn-find-pw').hasClass('on')) {
                        $('.find-pw').addClass('on');
                        $('.find-id').removeClass('on');
                    }
                }
            }
            initMobileTab();

            $('.tab-btn-area span').on('click', function() {
                if ($(window).width() <= 1023) {
                    
                    $('.tab-btn-area span').removeClass('on');
                    $(this).addClass('on');

                    $('.find-info-in > div').removeClass('on');
                    
                    if ($(this).hasClass('btn-find-id')) {
                        $('.find-id').addClass('on');
                    } else if ($(this).hasClass('btn-find-pw')) {
                        $('.find-pw').addClass('on');
                    }
                }
            });

            $(window).on('resize', function() {
                if ($(window).width() <= 1023) {
                    initMobileTab();
                } else {
                    $('.find-info-in > div').removeClass('on');
                }
            });
        });

    </script>
</head>
<body>
<div class="wrap login-page">
    <div class="login-page-in">
        <header>
            <div class="header-in">
                <div class="logo-area">
                    <a href=""><img src="./images/logo-sform-w.svg" alt="에스폼 로고"/></a>
                </div>
                <div class="language-selector">
                    <div class="select-area">
                        <select name="language" id="lang-select">
                            <option value="">선택</option>
                            <option value="ko" selected>한국어</option>
                            <option value="en">영어</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-area">
            <!-- ! .on -->
            <section class="login-area on">
                <h2>로그인</h2>
                <div class="login-area-in">
                    <form>
                        <div class="form-area">
                            <dl class="id-area">
                                <dt>아이디</dt>
                                <dd><input class="inp" type="text" placeholder="아이디를 입력해주세요"></dd>
                            </dl>
                            <dl class="pw-area">
                                <dt>비밀번호</dt>
                                <dd><input class="inp" type="password" placeholder="비밀번호를 입력해주세요"><span class="btn-toggle"></span></dd>
                            </dl>
                            <div class="checkbox-area">
                                <input type="checkbox" id="check-id" title="아이디 저장">
                                <label for="check-id" class="check-label">아이디 저장</label>
                            </div>
                        </div>
                    </form>
                    <div class="btn-area">
                        <button type="button" class="btn-login">로그인</button>
                        <button type="button" class="btn-login-google">구글 로그인</button>
                    </div>
                    <div class="btn-link section-change">
                        <a href="">아이디/비밀번호 찾기</a>
                    </div>
                </div>
            </section>
            <!-- ! .on -->
            <section class="login-area find-info">
                <div class="tab-btn-area">
                    <!-- ! .on -->
                    <span class="btn-find-id on">아이디 찾기</span>
                    <span class="btn-find-pw">비밀번호 찾기</span>
                </div>
                <div class="find-info-in">
                    <div class="find-id">
                        <h2>아이디 찾기</h2>
                        <p class="add-desc">가입시 입력하신 사업자번호, 성명, 핸드폰번호를 입력하시면 가입시 등록하신 핸드폰번호로 아이디가 전송됩니다.</p>
                        <div class="login-area-in">
                            <form>
                                <div class="form-area">
                                    <dl>
                                        <dt>사업자번호</dt>
                                        <dd><input class="inp" type="text" placeholder="사업자번호를 입력해주세요"></dd>
                                    </dl>
                                    <dl>
                                        <dt>성명</dt>
                                        <dd><input class="inp" type="text" placeholder="성명을 입력해주세요"></dd>
                                    </dl>
                                    <dl>
                                        <dt>핸드폰번호</dt>
                                        <dd><input class="inp" type="text" placeholder="핸드폰번호를 입력해주세요"></dd>
                                    </dl>
                                </div>
                            </form>
                            <div class="btn-area">
                                <button type="button" class="btn-find">아이디 전송</button>
                            </div>
                        </div>
                    </div>
                    <div class="find-pw">
                        <h2>비밀번호 찾기</h2>
                        <p class="add-desc">가입시 입력하신 사업자번호, 아이디, 핸드폰번호를 입력하시면 가입시 등록하신 핸드폰번호로 임시 비밀번호가 전송됩니다.</p>
                        <div class="login-area-in">
                            <form>
                                <div class="form-area">
                                    <dl>
                                        <dt>사업자번호</dt>
                                        <dd><input class="inp" type="text" placeholder="사업자번호를 입력해주세요"></dd>
                                    </dl>
                                    <dl>
                                        <dt>아이디</dt>
                                        <dd><input class="inp" type="text" placeholder="아이디를 입력해주세요"></dd>
                                    </dl>
                                    <dl>
                                        <dt>핸드폰번호</dt>
                                        <dd><input class="inp" type="text" placeholder="핸드폰번호를 입력해주세요"></dd>
                                    </dl>
                                </div>
                            </form>
                            <div class="btn-area">
                                <button type="button" class="btn-find">임시 비밀번호 전송</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn-link section-change">
                    <a href="">로그인으로 돌아가기</a>
                </div>
            </section>
        </div>

        <footer>
            <div class="footer-in">
                <ul class="info-area">
                    <li>ⓒUNIPOST. All rights reserved.</li>
                </ul>
            </div>
        </footer>
    </div>
</div>
</body>
</html>
